  startup_seconds:
    type: integer
    label: 启动就绪等待秒数
    default: 15
    minimum: 1
    maximum: 45
    description: 超时保留正在加载的受管进程，不重复启动；稍后刷新状态。
  stop_seconds:
    type: integer
    label: 优雅停止等待秒数
    default: 5
    minimum: 1
    maximum: 10
    description: 仅停止本插件当前持有的子进程；POSIX 同时清理该子进程组。
config: {}
